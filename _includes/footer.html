    <!-- Site footer -->
    <footer class="site-footer">
      <div class="container site-footer__inner">
        <div>
          &copy; {{ site.time | date: '%Y' }} {{ site.first_name }} {{ site.middle_name }} {{ site.last_name }}.
          {%- if site.impressum_path %}
          <a href="{{ site.impressum_path | relative_url }}">Impressum</a>.
          {%- endif -%}
          {%- if site.last_updated %}
          <span class="d-block d-sm-inline">Last updated: {{ "now" | date: '%B %d, %Y' }}.</span>
          {%- endif %}
        </div>
        <div class="site-footer__links">
          <a href="{{ '/blog/' | relative_url }}">Blog</a>
          <a href="{{ '/publications/' | relative_url }}">Yayınlar</a>
          <a href="{{ '/en/publications/' | relative_url }}">Publications</a>
          <a href="{{ '/feed.xml' | relative_url }}">RSS</a>
          <a href="https://www.youtube.com/@{{ site.youtube_id }}" rel="noopener">YouTube</a>
          <a href="https://github.com/{{ site.github_username }}" rel="noopener">GitHub</a>
          <a href="https://orcid.org/{{ site.orcid_id }}" rel="noopener">ORCID</a>
        </div>
      </div>
    </footer>
