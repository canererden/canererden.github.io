    <!-- Standard bottom footer -->
    <footer class="mt-5" style="background-color: var(--global-bg-color); border-top: 1px solid var(--global-divider-color); padding: 2rem 0; font-size: 0.9rem;">
      <div class="container text-center" style="color: var(--global-text-color);">
        &copy; Copyright {{ site.time | date: '%Y' }} {{ site.first_name }} {{ site.middle_name }} {{ site.last_name }}. {{ site.footer_text }}
        {%- if site.impressum_path -%}
        <a href="{{ site.url }}{{ site.baseurl }}{{ site.impressum_path }}" style="color: var(--global-theme-color);">Impressum</a>.
        {%- endif -%}
        {%- if site.last_updated -%}
        <br>Last updated: {{ "now" | date: '%B %d, %Y' }}.
        {%- endif %}
      </div>
    </footer>
